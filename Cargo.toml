[package]
name = "stalzone-heal"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
xcap = "0.9.8"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
device_query = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true